name: SEO phase one preflight
on:
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'tests/**', '.github/workflows/seo-phase1-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    # Browser binaries and Ubuntu dependencies are included in the pinned image.
    # Avoid slow apt downloads on every PR: this previously hit workflow timeouts.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate cached product rendering, SEO and interaction logic
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_site.py --reuse-data
          python scripts/validate_seo_files.py
          python scripts/audit_products.py
          npm ci --ignore-scripts
          PET_COST_TEST_SITE=1 npm test
          python - <<'PY'
          from pathlib import Path
          text=(Path("site")/"categories/pet-sheets/index.html").read_text()
          assert "レギュラー・ワイド・スーパーワイドから普段使うサイズを選び" in text
          PY
      - name: Verify sheet selection at 320, 390 and 1440 pixels
        run: |
          npm install --prefix /tmp/sheet-qa --no-audit --no-fund playwright@1.56.1 lighthouse@12.8.2
          node -e "const {chromium,webkit}=require('/tmp/sheet-qa/node_modules/playwright'); const fs=require('fs'); for(const b of [chromium,webkit]) { if (!fs.existsSync(b.executablePath())) throw Error('Missing browser: '+b.executablePath()); }"
          NODE_PATH=/tmp/sheet-qa/node_modules node scripts/check_sheet_presentation.cjs
          SHEET_QA_BROWSER=webkit NODE_PATH=/tmp/sheet-qa/node_modules node scripts/check_sheet_presentation.cjs
      - name: Save unpublished sheet comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-presentation-evidence
          path: audit-results/sheet-presentation/
          retention-days: 14
