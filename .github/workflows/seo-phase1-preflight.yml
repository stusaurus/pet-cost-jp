name: SEO phase one preflight
on:
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'tests/**', '.github/workflows/seo-phase1-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate cached product rendering, SEO and interaction logic
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_site.py --reuse-data
          python scripts/validate_seo_files.py
          python scripts/audit_products.py
          npm ci --ignore-scripts
          PET_COST_TEST_SITE=1 npm test
          python - <<'PY'
          from pathlib import Path
          text=(Path("site")/"categories/pet-sheets/index.html").read_text()
          assert "レギュラー・ワイド・スーパーワイドのサイズ別に" in text
          PY
      - name: Verify sheet selection at 320, 390 and 1440 pixels
        run: |
          npm install --prefix /tmp/sheet-qa --no-audit --no-fund playwright@1.56.1 lighthouse@12.8.2
          /tmp/sheet-qa/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/sheet-qa/node_modules node scripts/check_sheet_presentation.cjs
      - name: Save unpublished sheet comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-presentation-evidence
          path: audit-results/sheet-presentation/
          retention-days: 14
