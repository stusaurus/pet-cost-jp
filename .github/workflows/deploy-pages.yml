name: Build and deploy pet-cost-jp
on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *" # 06:20 JST
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "categories/**"
      - "data/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".nojekyll"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pet-cost-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build site
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
        run: python scripts/build_site.py
      - name: Product quality audit
        run: python scripts/audit_products.py
      - name: Mirror generated site to main branch
        run: |
          rm -rf categories data
          cp site/index.html ./index.html
          cp -R site/categories ./categories
          cp -R site/data ./data
          cp site/robots.txt ./robots.txt
          cp site/sitemap.xml ./sitemap.xml
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html categories data robots.txt sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo "Published files already match generated site."
          else
            git commit -m "Sync generated Pages output"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
