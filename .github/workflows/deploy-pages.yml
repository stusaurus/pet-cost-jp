name: Build and deploy pet-cost-jp
on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *" # 06:20 JST
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "categories/**"
      - "data/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".nojekyll"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pet-cost-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts
      - name: Build site
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
        run: python scripts/build_site.py
      - name: Validate sitemap and robots discovery files
        run: python scripts/validate_seo_files.py
      - name: Comparison interaction regression tests
        env:
          PET_COST_TEST_SITE: "1"
        run: npm test
      - name: Product quality audit
        run: python scripts/audit_products.py
      - name: Mirror generated site to main branch
        run: |
          rm -rf categories data
          cp site/index.html ./index.html
          cp -R site/categories ./categories
          cp -R site/data ./data
          cp site/robots.txt ./robots.txt
          cp site/sitemap.xml ./sitemap.xml
          cp site/404.html ./404.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html categories data robots.txt sitemap.xml 404.html .nojekyll
          if git diff --cached --quiet; then
            echo "Published files already match generated site."
          else
            git commit -m "Sync generated Pages output"
            git push origin HEAD:main
          fi
      - name: Add IndexNow verification key
        run: printf '%s' '7d4f93c2a6814eb5b0d87f216ca9e403' > site/7d4f93c2a6814eb5b0d87f216ca9e403.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://stusaurus.github.io/pet-cost-jp/
          INDEXNOW_KEY: 7d4f93c2a6814eb5b0d87f216ca9e403
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET
          base=os.environ["SITE_URL"]; key=os.environ["INDEXNOW_KEY"]; key_url=base+key+".txt"
          if urllib.request.urlopen(key_url, timeout=20).read().decode().strip()!=key: raise SystemExit("IndexNow key verification failed")
          xml=urllib.request.urlopen(base+"sitemap.xml", timeout=20).read()
          root=ET.fromstring(xml); urls=[e.text.strip() for e in root.iter() if e.tag.endswith("loc") and e.text]
          req=urllib.request.Request("https://api.indexnow.org/IndexNow", data=json.dumps({"host":"stusaurus.github.io","key":key,"keyLocation":key_url,"urlList":urls}).encode(), headers={"Content-Type":"application/json; charset=utf-8"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r: print("IndexNow", r.status, "URLs", len(urls))
          PY
