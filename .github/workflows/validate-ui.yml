name: Validate comparison UI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pet-cost-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python scripts/audit_products.py
